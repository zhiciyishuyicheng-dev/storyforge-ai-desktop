name: Build and publish XStudio 1.1.0

on:
  push:
    branches: [release/xstudio-build-1.1.0]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install exact locked dependencies
        run: |
          node -e "const fs=require('node:fs');const p=JSON.parse(fs.readFileSync('package-lock.json','utf8'));for(const x of Object.values(p.packages)){if(x.resolved?.startsWith('https://registry.npmmirror.com/'))x.resolved=x.resolved.replace('https://registry.npmmirror.com/','https://registry.npmjs.org/')}fs.writeFileSync('package-lock.json',JSON.stringify(p,null,2)+'\n')"
          npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
      - name: Install official Electron runtime
        run: |
          $version = node -p "require('./package-lock.json').packages['node_modules/electron'].version"
          $zip = Join-Path $env:RUNNER_TEMP 'electron.zip'
          Invoke-WebRequest "https://github.com/electron/electron/releases/download/v$version/electron-v$version-win32-x64.zip" -OutFile $zip
          Expand-Archive -LiteralPath $zip -DestinationPath node_modules/electron/dist -Force
          Set-Content -LiteralPath node_modules/electron/path.txt -Value electron.exe -Encoding ascii -NoNewline
      - name: Run all tests
        run: npm test
      - name: Build frontend
        run: npm run build
      - name: Build Windows installer
        run: |
          $env:ELECTRON_BUILDER_CACHE = Join-Path $env:RUNNER_TEMP 'electron-builder'
          $wrapper = Join-Path $env:RUNNER_TEMP 'storyforge-pack.cjs'
          @'
          const path = require('node:path');
          const fs = require('node:fs');
          const { spawn } = require('node:child_process');
          const repo = process.cwd();
          const { NodeModulesCollector } = require(path.join(repo, 'node_modules/app-builder-lib/out/node-module-collector/nodeModulesCollector.js'));
          const original = NodeModulesCollector.prototype.streamCollectorCommandToFile;
          NodeModulesCollector.prototype.streamCollectorCommandToFile = function(command, args, cwd, output) {
            if (!/npm(?:\.cmd)?$/i.test(command)) return original.call(this, command, args, cwd, output);
            return new Promise((resolve, reject) => {
              const file = fs.createWriteStream(output);
              const npmCli = path.join(path.dirname(process.execPath), 'node_modules/npm/bin/npm-cli.js');
              const child = spawn(process.execPath, [npmCli, ...args], { cwd, windowsHide: true });
              child.stdout.pipe(file);
              let error = ''; child.stderr.on('data', data => error += data);
              child.on('error', reject);
              child.on('exit', code => file.end(() => code === 0 || code === 1 ? resolve() : reject(new Error(error))));
            });
          };
          require(path.join(repo, 'scripts/desktop-pack.cjs')).runDesktopPack(['--win','nsis','--x64','--config.electronDist=node_modules/electron/dist','--config.npmRebuild=false','--config.win.signExecutable=false','--publish','never']).catch(error => { console.error(error); process.exitCode = 1; });
          '@ | Set-Content -LiteralPath $wrapper -Encoding utf8
          node $wrapper
      - name: Verify original icons and product metadata
        run: |
          $verify = Join-Path $env:RUNNER_TEMP 'verify-icons.cjs'
          @'
          const fs = require('node:fs');
          const path = require('node:path');
          const assert = require('node:assert/strict');
          const { createRequire } = require('node:module');
          const local = createRequire(path.join(process.cwd(), 'package.json'));
          const pe = local('pe-library');
          const resedit = local('resedit');
          const ico = fs.readFileSync('public/studio.ico');
          const originals = Array.from({length: ico.readUInt16LE(4)}, (_, i) => { const at = 6 + i * 16; return ico.subarray(ico.readUInt32LE(at+12), ico.readUInt32LE(at+12)+ico.readUInt32LE(at+8)); });
          for (const file of ['release-v1.1.0/win-unpacked/XStudio.exe','release-v1.1.0/XStudio-Setup-1.1.0-x64.exe']) {
            const resources = pe.NtExecutableResource.from(pe.NtExecutable.from(fs.readFileSync(file)));
            const icons = resources.entries.filter(e => e.type === 3).map(e => Buffer.from(e.bin));
            assert.ok(originals.every(icon => icons.some(bin => bin.equals(icon))), 'Embedded icons differ: '+file);
            const versions = resedit.Resource.VersionInfo.fromEntries(resources.entries);
            assert.ok(versions.some(v => v.getAllLanguagesForStringValues().some(lang => { const x = v.getStringValues(lang); return x.ProductName === 'XStudio' && x.FileVersion === '1.1.0'; })), 'Incorrect product metadata: '+file);
            console.log(file+': original icon bytes and product metadata verified');
          }
          '@ | Set-Content -LiteralPath $verify -Encoding utf8
          node $verify
      - name: Prepare source and checksums
        run: |
          git archive --format=zip --prefix=storyforge-ai-desktop/ --output=release-v1.1.0/XStudio-1.1.0-source.zip HEAD
          $files = @('release-v1.1.0/XStudio-Setup-1.1.0-x64.exe','release-v1.1.0/XStudio-1.1.0-source.zip')
          $lines = $files | ForEach-Object { $hash = (Get-FileHash -LiteralPath $_ -Algorithm SHA256).Hash.ToLowerInvariant(); "$hash  $([System.IO.Path]::GetFileName($_))" }
          [System.IO.File]::WriteAllText((Join-Path $PWD 'release-v1.1.0/SHA256SUMS.txt'), ($lines -join "`n") + "`n")
      - name: Publish release with verified assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.1.0 release-v1.1.0/XStudio-Setup-1.1.0-x64.exe release-v1.1.0/XStudio-1.1.0-source.zip release-v1.1.0/SHA256SUMS.txt --target $env:GITHUB_SHA --title "XStudio 1.1.0" --notes-file docs/releases/v1.1.0.md --repo $env:GITHUB_REPOSITORY
